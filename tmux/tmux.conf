# Every path below is $TMUX_CONF_DIR-relative, so relocating this config
# (mounting the dotfiles repo somewhere else, or invoking tmux.conf directly
# from a repo checkout instead of through the ~/.config/tmux symlink) only
# needs that one env var, not an edit to this file. tmux config files DO
# expand $VAR/${VAR} from the real process environment tmux inherited at
# startup (confirmed empirically) -- but only from that inherited
# environment: it can't be computed from inside tmux.conf itself, since
# tmux has no way to introspect the path of the file currently being
# sourced, and set-environment run earlier in this same file does NOT
# retroactively affect $VAR expansion on later lines (also confirmed
# empirically). So $TMUX_CONF_DIR must be exported by whatever shell
# launches tmux -- setup_dotfiles.sh does this for you; if it's unset here,
# re-run that script (or `git pull` first if it's stale). If it's unset,
# every path below silently resolves wrong (empty-prefixed) and things
# fail with cryptic "No such file"/"returned 127" errors -- display-message
# can't surface a clearer error here since no client/session exists yet
# this early in config parsing (confirmed empirically).
source $TMUX_CONF_DIR/tmux.conf.default

# 0 is too far from ` ;)
set -g base-index 1

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

# Set the escape time to 10 milliseconds for the session and globally
# This makes tmux more responsive to keybindings, especially in fast-paced environments
set-option -sg escape-time 10

#set -g default-terminal screen-256color
set -g status-keys vi
set -g history-limit 10000

# Allow vim keybindings
# (To copy text it is needed to download xclip by:
# sudo apt-get intall xclip)
setw -g mode-keys vi

# Allow the use of the mouse
set -g mouse on
setw -g monitor-activity on

# Horizontal and vertical splits
bind-key v split-window -h
bind-key a split-window -v


# Use alt-vim keys without prefix key to resize panes
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-H resize-pane -L 5
bind -n M-L resize-pane -R 5

# Use Alt-vim keys without prefix key to switch panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Vim style copy and yank commands
bind -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X  copy-pipe-and-cancel "xclip -sel clip -i"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -sel clip -i"
bind -n C-p paste-buffer

# Switch windows
bind -n M-m previous-window
bind -n M-n next-window

# Swap windows inside a session
bind -n M-. swap-window -t +1 \; select-window -t +1 # Swap current window with the next one using > and stay in the original window
bind -n M-, swap-window -t -1 \; select-window -t -1 # Swap current window with the previous one using < and stay in the original window

# Test theprimeagen tmux stuff
bind-key -r k display-popup -E -w 60% -h 50% -b rounded -S "fg=cyan" -T " Kill Session " "$TMUX_CONF_DIR/scripts/tmux_session_killer"
bind-key -r s display-popup -E -w 60% -h 50% -b rounded -S "fg=cyan" -T " Switch Session " "$TMUX_CONF_DIR/scripts/tmux_session_switcher"
bind-key -r w run-shell "tmux neww $TMUX_CONF_DIR/scripts/tmux_window_switcher"
bind-key -r g run-shell "tmux neww lazygit"
bind-key n display-popup -E -w 40% -h 7 -b rounded -S "fg=cyan" -T " New Session " "$TMUX_CONF_DIR/scripts/tmux_new_session_popup"
bind-key ? display-popup -E -w 50% -h 60% -b rounded -S "fg=cyan" -T " Cheatsheet " "$TMUX_CONF_DIR/scripts/tmux_cheatsheet"

# Reload tmux config
bind-key r source-file $TMUX_CONF_DIR/tmux.conf

# List of plugins
# NOTE: tmux2k must load before resurrect/continuum. tmux2k wipes and
# rebuilds status-left/status-right from scratch on load, which would
# erase continuum's autosave hook if continuum loaded first.
set -g @plugin 'plugins/tpm'
set -g @plugin '2KAbhishek/tmux2k'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Automatic session restore
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'

# Automatic tpm installation
if "test ! -d $TMUX_CONF_DIR/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm $TMUX_CONF_DIR/plugins/tpm'"

set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",ghostty*:Tc"
set -as terminal-features "ghostty*:RGB"
set -g @tmux2k-left-plugins "session"
set -g @tmux2k-right-plugins "cpu ram gpu"
set -g @tmux2k-session-colors "light_blue black"
set -g @tmux2k-refresh-rate 5
set -g @tmux2k-icons-only false
set -g @tmux2k-bg-main '#3f3f4f'               # grey status bar
set -g @tmux2k-window-list-colors "gray green" # current window: powerline blends into grey bar

# Prompt for session name on startup when no resurrect file exists
set-hook -g after-new-session 'run-shell "$TMUX_CONF_DIR/scripts/tmux_startup_session_name"'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '$TMUX_CONF_DIR/plugins/tpm/tpm'

# Auto-install any plugin listed above (@plugin lines) that isn't already
# present, so a fresh machine/container gets tmux2k/resurrect/continuum on
# the very first tmux start without needing prefix+I. install_plugins skips
# plugins that are already installed, so this is a cheap no-op afterwards.
run '$TMUX_CONF_DIR/plugins/tpm/bin/install_plugins'

# tmux2k's gpu.sh always shows N/A on hybrid-graphics laptops (grabs the
# first VGA PCI device, which is the iGPU, not NVIDIA) and on Jetson boards
# (Tegra GPU isn't a PCI device at all). TPM manages plugins/tmux2k
# (gitignored, not a submodule), so it can't carry a patch itself -- reapply
# a small patch to its gpu.sh on every tmux start instead (idempotent, see
# scripts/tmux2k_patch_gpu.sh).
run '$TMUX_CONF_DIR/scripts/tmux2k_patch_gpu.sh'

# These must come AFTER run tpm so tmux2k does not overwrite them.
# Commas inside #[...] break #{?...} conditional parsing, so each attribute
# is a separate #[...] block.
# - Idle shell (*sh match): dim white text on grey bar
# - Running process: yellow + blink
# - Activity flag (output while away): also yellow + blink
setw -g window-status-format "#{?window_activity_flag,#[fg=colour226]#[blink],#{?#{m:*sh,#{pane_current_command}},#[fg=colour102]#[noblink],#[fg=colour226]#[blink]}} #I:#W "

# To allow copy images onto nvim when using tmux
set -g allow-passthrough on

set -s set-clipboard on
