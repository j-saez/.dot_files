# This first line is the one hardcoded exception: tmux has no way to
# introspect the path of the file currently being sourced, so nothing can
# be computed before it runs. ~/.config/tmux is safe to assume here because
# it's created by one of the very first, least failure-prone steps of
# setup_dotfiles.sh (a plain symlink, before any package-manager/download
# steps that can fail for unrelated reasons -- confirmed on real hardware:
# this exact machine had setup_dotfiles.sh die later on an unrelated broken
# apt/CUDA dependency, well after the symlink step had already succeeded).
source ~/.config/tmux/tmux.conf.default

# Every #{@tmux_conf_dir} reference below resolves to $TMUX_CONF_DIR if
# it's exported (e.g. to point at a repo checkout mounted somewhere other
# than ~/.config/tmux), falling back to ~/.config/tmux otherwise -- so
# relocating this config needs at most one env var, and the common case
# (the ~/.config/tmux symlink already exists) needs nothing at all, not
# even a shell rc having been sourced. This can't be a plain $TMUX_CONF_DIR
# substitution throughout, the way the line above is: tmux config files DO
# expand bare $VAR/${VAR} from the real process environment at parse time
# (confirmed empirically), but NOT shell-style ${VAR:-default} fallback
# syntax -- that silently fails closed (empty), it does not fall through to
# the default. Real fallback logic needs an actual shell, hence computing
# it once via `run` below and referencing it as a tmux option everywhere
# else via #{} expansion (also confirmed to work in every command used
# below, including single-quoted ones, despite not being documented
# per-command).
run 'tmux set -g @tmux_conf_dir "${TMUX_CONF_DIR:-$HOME/.config/tmux}"'

# 0 is too far from ` ;)
set -g base-index 1

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

# Set the escape time to 10 milliseconds for the session and globally
# This makes tmux more responsive to keybindings, especially in fast-paced environments
set-option -sg escape-time 10

#set -g default-terminal screen-256color
set -g status-keys vi
set -g history-limit 10000

# Allow vim keybindings
# (To copy text it is needed to download xclip by:
# sudo apt-get intall xclip)
setw -g mode-keys vi

# Allow the use of the mouse
set -g mouse on
setw -g monitor-activity on

# Horizontal and vertical splits
bind-key v split-window -h
bind-key a split-window -v


# Use alt-vim keys without prefix key to resize panes
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-H resize-pane -L 5
bind -n M-L resize-pane -R 5

# Use Alt-vim keys without prefix key to switch panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Vim style copy and yank commands
bind -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X  copy-pipe-and-cancel "xclip -sel clip -i"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -sel clip -i"
bind -n C-p paste-buffer

# Switch windows
bind -n M-m previous-window
bind -n M-n next-window

# Swap windows inside a session
bind -n M-. swap-window -t +1 \; select-window -t +1 # Swap current window with the next one using > and stay in the original window
bind -n M-, swap-window -t -1 \; select-window -t -1 # Swap current window with the previous one using < and stay in the original window

# Test theprimeagen tmux stuff
#
# Every one of these resolves @tmux_conf_dir via run-shell + a real shell
# $(...) substitution, rather than embedding #{@tmux_conf_dir} directly in
# display-popup's own shell-command argument -- that couldn't be confirmed
# reliable the same way run-shell's argument was (display-popup requires an
# attached client to test at all, which wasn't reproducible in any sandbox
# available while debugging this), so this sticks to the one pattern
# already proven to work end-to-end (same as the reload binding below).
bind-key -r k run-shell 'tmux display-popup -E -w 60% -h 50% -b rounded -S "fg=cyan" -T " Kill Session " "$(tmux show -gqv @tmux_conf_dir)/scripts/tmux_session_killer"'
bind-key -r s run-shell 'tmux display-popup -E -w 60% -h 50% -b rounded -S "fg=cyan" -T " Switch Session " "$(tmux show -gqv @tmux_conf_dir)/scripts/tmux_session_switcher"'
bind-key -r w run-shell 'tmux neww "$(tmux show -gqv @tmux_conf_dir)/scripts/tmux_window_switcher"'
bind-key -r g run-shell "tmux neww lazygit"
bind-key n run-shell 'tmux display-popup -E -w 40% -h 7 -b rounded -S "fg=cyan" -T " New Session " "$(tmux show -gqv @tmux_conf_dir)/scripts/tmux_new_session_popup"'
bind-key ? run-shell 'tmux display-popup -E -w 50% -h 60% -b rounded -S "fg=cyan" -T " Cheatsheet " "$(tmux show -gqv @tmux_conf_dir)/scripts/tmux_cheatsheet"'

# Reload tmux config. source-file's own path argument doesn't undergo #{}
# expansion (confirmed empirically), so route through run-shell instead,
# which queries the already-set @tmux_conf_dir option via a real shell.
bind-key r run-shell 'tmux source-file "$(tmux show -gqv @tmux_conf_dir)/tmux.conf"'

# List of plugins
# NOTE: tmux2k must load before resurrect/continuum. tmux2k wipes and
# rebuilds status-left/status-right from scratch on load, which would
# erase continuum's autosave hook if continuum loaded first.
set -g @plugin 'plugins/tpm'
set -g @plugin '2KAbhishek/tmux2k'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Automatic session restore
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'

# Automatic tpm installation
if "test ! -d #{@tmux_conf_dir}/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm #{@tmux_conf_dir}/plugins/tpm'"

set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",ghostty*:Tc"
set -as terminal-features "ghostty*:RGB"
set -g @tmux2k-left-plugins "session"
set -g @tmux2k-right-plugins "cpu ram gpu"
set -g @tmux2k-session-colors "light_blue black"
set -g @tmux2k-refresh-rate 5
set -g @tmux2k-icons-only false
set -g @tmux2k-bg-main '#3f3f4f'               # grey status bar
set -g @tmux2k-window-list-colors "gray green" # current window: powerline blends into grey bar

# Prompt for session name on startup when no resurrect file exists
set-hook -g after-new-session 'run-shell "#{@tmux_conf_dir}/scripts/tmux_startup_session_name"'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '#{@tmux_conf_dir}/plugins/tpm/tpm'

# Auto-install any plugin listed above (@plugin lines) that isn't already
# present, so a fresh machine/container gets tmux2k/resurrect/continuum on
# the very first tmux start without needing prefix+I. install_plugins skips
# plugins that are already installed, so this is a cheap no-op afterwards.
run '#{@tmux_conf_dir}/plugins/tpm/bin/install_plugins'

# tmux2k's gpu.sh always shows N/A on hybrid-graphics laptops (grabs the
# first VGA PCI device, which is the iGPU, not NVIDIA) and on Jetson boards
# (Tegra GPU isn't a PCI device at all). TPM manages plugins/tmux2k
# (gitignored, not a submodule), so it can't carry a patch itself -- reapply
# a small patch to its gpu.sh on every tmux start instead (idempotent, see
# scripts/tmux2k_patch_gpu.sh).
run '#{@tmux_conf_dir}/scripts/tmux2k_patch_gpu.sh'

# These must come AFTER run tpm so tmux2k does not overwrite them.
# Commas inside #[...] break #{?...} conditional parsing, so each attribute
# is a separate #[...] block.
# - Idle shell (*sh match): dim white text on grey bar
# - Running process: yellow + blink
# - Activity flag (output while away): also yellow + blink
setw -g window-status-format "#{?window_activity_flag,#[fg=colour226]#[blink],#{?#{m:*sh,#{pane_current_command}},#[fg=colour102]#[noblink],#[fg=colour226]#[blink]}} #I:#W "

# To allow copy images onto nvim when using tmux
set -g allow-passthrough on

set -s set-clipboard on
